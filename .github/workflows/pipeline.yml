name: Pipeline de Engenharia de Qualidade (CI/CD)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    name: Validação de Qualidade e Segurança
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛡️ Checkout do Código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🧹 Análise Estática (Lint)
        run: npm run lint

      - name: 🏗️ Verificação de Tipagem e Build
        run: |
          npx tsc --noEmit
          npm run build

      - name: 🧪 Testes Unitários e Integração (Vitest)
        run: npm run test:coverage
        # O Vitest já está configurado para falhar se os thresholds no vitest.config.ts não forem atingidos

      - name: 🎭 Instalar Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🚀 Testes End-to-End (Playwright)
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: 📊 Relatórios de Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: ❌ Relatórios de Falha (E2E)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  security-audit:
    name: Auditoria de Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔍 Checagem de Vulnerabilidades
        run: npm audit --audit-level=high

  deploy-validation:
    name: Validação de Deploy
    needs: [quality-gate, security-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: 🚢 Simulação de Deploy Seguro
        run: |
          echo "Simulando deploy para ambiente de produção..."
          echo "Verificando integridade dos pacotes..."
          echo "Deploy realizado com sucesso após validação total do pipeline."
